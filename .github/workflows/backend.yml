name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "samples/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "samples/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run pytest

  postgres:
    # Production runs on PostgreSQL: apply every migration and seed the demo there.
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: revalo
          POSTGRES_USER: revalo
          POSTGRES_PASSWORD: revalo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U revalo" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      REVALO_DATABASE_URL: postgresql+psycopg://revalo:revalo@localhost:5432/revalo
      REVALO_STORAGE_DIR: /tmp/revalo-files
      REVALO_DEMO_PASSWORD: ci-demo-password
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --locked --extra postgres
      - run: uv run revalo demo
      - run: uv run revalo users list
